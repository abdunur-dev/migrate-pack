name: express-4-to-5
rules:
  - id: app-del-to-delete
    description: Replace app.del(...) with app.delete(...) (app.del was removed in Express 5)
    type: deterministic
    match:
      call: app.del
    replace:
      method: delete

  - id: req-accepts-charset-plural
    description: Replace req.acceptsCharset(...) with req.acceptsCharsets(...) (singular form removed in Express 5)
    type: deterministic
    match:
      call: req.acceptsCharset
    replace:
      method: acceptsCharsets

  - id: req-accepts-encoding-plural
    description: Replace req.acceptsEncoding(...) with req.acceptsEncodings(...) (singular form removed in Express 5)
    type: deterministic
    match:
      call: req.acceptsEncoding
    replace:
      method: acceptsEncodings

  - id: req-accepts-language-plural
    description: Replace req.acceptsLanguage(...) with req.acceptsLanguages(...) (singular form removed in Express 5)
    type: deterministic
    match:
      call: req.acceptsLanguage
    replace:
      method: acceptsLanguages

  - id: res-sendfile-camelcase
    description: Replace res.sendfile(...) with res.sendFile(...) (res.sendfile removed in Express 5)
    type: deterministic
    match:
      call: res.sendfile
    replace:
      method: sendFile

  # reorder-args, exactly 2 arguments only. Express 4 picks the status at runtime:
  # if the 2nd arg is a number it is the status, otherwise the 1st arg is.
  #   status-last:  res.json(obj, <number literal>) -> res.status(<number>).json(obj)
  #   status-first: res.json(<number literal>, obj) -> res.status(<number>).json(obj)
  #                 only when obj is an object/array/string/template/true/false/null literal.
  #                 res.json(404, someVar) is NOT rewritten: if someVar is a number at runtime,
  #                 Express 4 uses it as the status, so the rewrite could change behavior.
  # If BOTH args are number literals (e.g. res.json(200, 201)) nothing is rewritten;
  # res-json-two-args-unhandled reports it, because we can't tell which one is the status.
  - id: res-json-status-arg
    description: Replace res.json(obj, status) / res.json(status, obj) with res.status(status).json(obj) (both signatures removed in Express 5)
    type: reorder-args
    match:
      call: res.json
    reorder:
      chain: status
      forms: [status-last, status-first]

  # manual: reported as file + line, never edited.
  - id: res-json-two-args-unhandled
    description: res.json(...) with 2 arguments that res-json-status-arg could not safely rewrite
    type: manual
    match:
      call: res.json
      args: 2
      exceptRewrittenBy: res-json-status-arg
    note: Express 5 removed res.json(obj, status). Rewrite by hand as res.status(status).json(obj) once you have confirmed which argument is the status.

  - id: req-param-removed
    description: req.param(name) was removed in Express 5
    type: manual
    match:
      call: req.param
    note: Use req.params, req.body or req.query explicitly; which one depends on where the value comes from.

  - id: route-wildcard
    description: Route path strings containing "*" behave differently in Express 5 (path-to-regexp v8)
    type: manual
    match:
      routeString:
        objects: [app, router]
        methods: [all, delete, get, head, options, patch, post, put, use, route]
        contains: "*"
    note: Wildcards must be named in Express 5 (e.g. "/*splat" instead of "/*"); check the route still matches what you intend.
